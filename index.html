.mark{width:28px;height:28px;border-radius:8px;font-size:13px;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 28px}
.mark-high{background:#DC2626}.mark-mid{background:#F59E0B}.mark-low{background:#3B82F6}

.banner{padding:26px 16px 14px;color:#fff}
.b-t{font-size:21px;font-weight:700}
.b-s{font-size:11px;opacity:.85;margin-top:7px}
.b-tags{margin-top:12px;display:flex;gap:6px}
.banner.merchant{background:linear-gradient(135deg,#1E5AA8 0%,#3B82F6 100%)}
.banner.inv{background:linear-gradient(135deg,#1E5AA8 0%,#3B82F6 100%)}
.banner.gov{background:linear-gradient(135deg,#174A87 0%,#1E5AA8 60%,#3B82F6 100%)}

.rings-box{position:relative;width:300px;height:300px;margin:0 auto}
.ring{position:absolute;border-radius:50%;border:1px dashed;display:flex;align-items:center;justify-content:center}
.r-core{width:118px;height:118px;left:91px;top:91px;background:rgba(239,68,68,.10);border-color:#EF4444}
.r-mid{width:214px;height:214px;left:43px;top:43px;background:rgba(245,158,11,.08);border-color:#F59E0B}
.r-out{width:300px;height:300px;left:0;top:0;background:rgba(59,130,246,.05);border-color:#3B82F6}
.center-block{width:64px;height:64px;border-radius:8px;background:#1F2937;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
.pin{position:absolute;font-size:10px;color:#6B7280}
.pin-1{right:6px;top:116px;color:#EF4444}

.pin-3{right:-18px;top:40px;color:#3B82F6}
.shop-dot{position:absolute;width:10px;height:10px;border-radius:50%;background:#EF4444;border:2px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.25)}
.legend{display:flex;gap:16px;margin-top:14px;justify-content:center}
.lg{display:flex;align-items:center;gap:5px;font-size:11px;color:#6B7280}
.dot-s{width:9px;height:9px;border-radius:50%}
.legend .core{background:#EF4444}.legend .mid{background:#F59E0B}.legend .out{background:#3B82F6}

.steps{display:flex;padding:6px 0}
.step{flex:1;text-align:center;position:relative}
.step .c{width:26px;height:26px;border-radius:50%;background:#E5E7EB;color:#9CA3AF;font-size:12px;line-height:26px;margin:0 auto}
.step .l{font-size:11px;color:#9CA3AF;margin-top:6px}
.step.done .c{background:#1E5AA8;color:#fff}
.step.done .l{color:#1E5AA8}
.step.on .c{background:#F59E0B;color:#fff}
.step.on .l{color:#B45309;font-weight:600}
.step::after{content:"";position:absolute;top:13px;left:50%;width:100%;height:2px;background:#E5E7EB}
.step:first-child::after{display:none}
.step.done::after{background:#1E5AA8}
.step.on::after{background:#1E5AA8}

.timeline{padding:4px 0}
.tl-item{position:relative;padding:0 0 18px 22px}
.tl-item:last-child{padding-bottom:4px}
.tl-item::before{content:"";position:absolute;left:5px;top:8px;width:8px;height:8px;border-radius:50%;background:#D1D5DB}
.tl-item::after{content:"";position:absolute;left:8px;top:20px;bottom:0;width:2px;background:#E5E7EB}
.tl-item:last-child::after{display:none}
.tl-item.on::before{background:#16A34A}
.tl-item.on::after{background:#DCFCE7}
.tl-item .t{font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
.tl-item .s{font-size:12px;color:#8A94A6;margin-top:4px}
.tl-item .d{font-size:11px;color:#B4BCC9;margin-top:3px}

.progress .track{height:8px;background:#E5EDF8;border-radius:999px;overflow:hidden}
.progress .fill{height:100%;background:linear-gradient(90deg,#1E5AA8,#3B82F6);border-radius:999px}

.seg{display:flex;background:#E9EDF4;border-radius:10px;padding:3px;margin-bottom:12px}
.seg-item{flex:1;text-align:center;padding:8px;font-size:13px;color:#6B7280;border-radius:8px;cursor:pointer}

.field{margin-bottom:12px}

.slider{width:100%;accent-color:#1E5AA8;height:26px}
.pick{border:1px solid #E5E9F0;border-radius:10px;overflow:hidden}
.pick-item{padding:11px 12px;font-size:13px;border-bottom:1px solid #F3F4F6;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.pick-item:last-child{border-bottom:none}
.pick-item.on{background:#EAF1FA;color:#1E5AA8;font-weight:600}
.up-grid{display:flex;gap:10px}
.up-item{flex:1;background:#F8FAFF;border:1px dashed #C9D8EE;border-radius:10px;padding:14px 6px;text-align:center;font-size:11px;color:#6B7280;cursor:pointer}
.up-item .up-ico{font-size:20px;display:block;margin-bottom:4px}

.result-card{border:1.5px solid #1E5AA8}
.level-row{display:flex;gap:14px;align-items:center}
.level-badge{width:76px;height:76px;border-radius:50%;background:#FEF3C7;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 76px}
.level-v{font-size:22px;font-weight:700;color:#B45309}
.level-k{font-size:9px;color:#B45309}
.result-grid{display:flex;flex-wrap:wrap;gap:10px}
.result-grid .metric{border-left:3px solid #E5E9F0}
.result-grid .metric.o{border-color:#F59E0B}
.result-grid .metric.r{border-color:#DC2626}
.result-grid .metric.b{border-color:#3B82F6}
.result-grid .metric.g{border-color:#16A34A}
.compare-row{display:flex;gap:8px}
.cp-item{flex:1;background:#F5F7FA;border-radius:8px;padding:12px;text-align:center}
.cp-k{font-size:10px;color:#6B7280}
.cp-v{font-size:17px;font-weight:700;margin-top:5px}

.contact{display:flex;gap:12px}
.avatar{width:50px;height:50px;border-radius:50%;background:#1E5AA8;color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;flex:0 0 50px}

.total-card{background:linear-gradient(160deg,#F8FAFF 0%,#EEF4FF 100%);display:flex;flex-direction:column;align-items:center;padding-top:22px}
.total-ring{width:168px;height:168px;border-radius:50%;background:conic-gradient(#1E5AA8 0 68%,#E5EDF8 68% 100%);display:flex;align-items:center;justify-content:center}
.total-inner{width:126px;height:126px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.total-v{font-size:20px;font-weight:800;color:#1E5AA8}
.total-k{font-size:11px;color:#6B7280;margin-top:5px}

.tbl{border:1px solid #E5E9F0;border-radius:10px;overflow:hidden}
.tbl-row{display:flex}
.tbl-head{background:#F5F7FA}
.tbl-head .tc{font-size:11px;color:#6B7280;font-weight:600}
.tc{flex:1;text-align:center;padding:10px 4px;font-size:12px}
.c1{flex:1.4;text-align:left;padding-left:10px}
.tbl .row{border-top:1px solid #EEF1F6}
.tbl .row.best{background:#EFF6FF}
.tbl .row.best .tc{color:#1E5AA8;font-weight:700}

.pill{background:#EAF1FA;color:#1E5AA8;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:8px}
.pill:last-child{margin-bottom:0}

.map-block{width:100%;border-radius:10px;overflow:hidden;border:1px solid #E5E9F0;background:#F8FAFF;line-height:0}

.fund-total{background:linear-gradient(135deg,#1E5AA8 0%,#3B82F6 100%);color:#fff}
.ft-v{font-size:30px;font-weight:800}
.ft-k{font-size:12px;opacity:.85;margin-top:6px}

.w-track{height:8px;background:#EEF1F6;border-radius:999px;margin-top:8px;overflow:hidden}
.w-fill{height:100%;border-radius:999px}

.me-card{display:flex;align-items:center;gap:12px}
.me-avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#1E5AA8,#3B82F6);color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 56px}
.me-name{font-size:17px;font-weight:700}
.svc{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #F3F4F6}
.svc:last-child{border-bottom:none}
.svc-ico{font-size:18px}
.svc-name{font-size:14px;font-weight:600}
.chev{color:#C0C8D4;font-size:16px}
.sub-mark{width:32px;height:32px;border-radius:8px;background:#EAF1FA;color:#1E5AA8;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 32px}

.toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:rgba(17,24,39,.8);color:#fff;font-size:13px;padding:10px 18px;border-radius:999px;z-index:99;white-space:nowrap}
.mask{position:absolute;inset:0;background:rgba(17,24,39,.45);z-index:50;display:flex;align-items:center;justify-content:center}
.modal{width:78%;background:#fff;border-radius:14px;padding:20px 18px 14px}
.md-title{font-size:16px;font-weight:700;text-align:center}
.md-content{font-size:13px;color:#6B7280;text-align:center;margin:12px 0 18px;line-height:1.6}
.md-btns{display:flex;gap:10px}
.md-btns .btn{margin-top:0}

/* 身份选择页 */
#role-page{position:relative;min-height:100%;background:#F5F7FA;display:flex;flex-direction:column}
.role-hero{background:linear-gradient(150deg,#174A87 0%,#1E5AA8 55%,#3B82F6 100%);padding:62px 24px 172px;color:#fff;border-bottom-left-radius:8px;border-bottom-right-radius:8px;text-align:center}
.role-hero h1{font-size:25px;font-weight:700;letter-spacing:1px}
.role-hero p{font-size:12px;opacity:.85;margin-top:12px;letter-spacing:1.5px}
.role-cards{margin:-128px 16px 0;position:relative}
.role-card{display:flex;align-items:center;gap:16px;background:#fff;border-radius:14px;padding:23px 18px;margin-bottom:14px;box-shadow:0 4px 16px rgba(23,37,84,.10);cursor:pointer}
.role-card:active{transform:scale(.985)}
.role-ico{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:25px;flex:0 0 52px}

.role-name{font-size:17px;font-weight:700}
.role-arrow{color:#C0C8D4;font-size:18px}
.guest-line{text-align:center;font-size:12px;color:#1E5AA8;margin:16px 0 28px;text-decoration:underline;cursor:pointer}
.role-feats{display:flex;gap:10px;margin:0 16px}
.feat{flex:1;background:#fff;border-radius:12px;padding:17px 8px;text-align:center;box-shadow:0 2px 10px rgba(23,37,84,.06)}
.feat-ico{display:block;font-size:18px;color:#1E5AA8;margin-bottom:9px}
.feat-t{display:block;font-size:13px;font-weight:700;color:#1F2937}
.feat-s{display:block;font-size:10px;color:#8A94A6;margin-top:5px;line-height:1.4}
.role-legal{font-size:10px;color:#B4BCC9;text-align:center;padding:24px 28px 20px;margin-top:auto}
</style>

function esc(s){
  var t = String(s == null ? '' : s), map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }, out = '';
  for (var i = 0; i < t.length; i++) { var c = t.charAt(i); out += (map[c] || c) }

}

/* ========== 外溢效应评估模型（演示标定） ==========
   依据 PRD 3.2.3：距离圈层 40% + 业态敏感度 30% + 围挡封闭度 30%。
   标定基准：过渡圈 + 餐饮 + 封闭度 0.6 → 营业额降幅 18%-28%（与平台原有展示一致）。
   注意：以下系数为演示标定值，非真实评估口径。 */
var RING_IDX = { '核心圈': 1.00, '过渡圈': 0.55, '外围圈': 0.20 };
/* 业态敏感度由 D.industryRisk 的高风险占比归一化得出，与投资方端「业态风险分布」结论一致 */
var BIZ_IDX = { '餐饮': 1.00, '零售': 0.70, '服务': 0.55, '便利店': 0.50, '其他': 0.45 };
var W = { dist: 0.40, biz: 0.30, seal: 0.30 };
var CLOSE_RANGE = { '高': '12-18%', '中': '8-12%', '低': '3-5%' };
var RECOVER_RANGE = { '高': '3-6 个月', '中': '2-4 个月', '低': '1-2 个月' };

function ringOf(dist){
  var d = Number(dist) || 0;
  for (var i = 0; i < D.rings.length; i++) if (d <= D.rings[i].max) return D.rings[i];
  return D.rings[D.rings.length - 1];
}

/* 唯一计算入口：测算页与损失评估页共用，保证两页数字必然一致 */
function assess(st){
  var s = st || calcState;
  var ring = ringOf(s.dist);
  var rev = Number(s.rev) || 0;
  var area = Number(s.area) || 0;
  var seal = Number(D.project.seal) || 0;
  var ri = RING_IDX[ring.name] || 0.20;
  var bi = BIZ_IDX[s.biz] || 0.45;
  var q = W.dist * ri + W.biz * bi + W.seal * seal;
  var c = Math.round(Math.max(3, Math.min(50, 23 + (q - 0.70) * 90)));
  var lo = Math.max(2, c - 5), hi = Math.min(55, c + 5);
  var level = ring.name === '核心圈' ? '高' : ring.name === '过渡圈' ? '中' : '低';
  var cls = ring.name === '核心圈' ? 'high' : ring.name === '过渡圈' ? 'warn' : 'low';
  var loss = Math.round(rev * c / 100);
  return {
    ring: ring, level: level, cls: cls, q: q, ri: ri, bi: bi, seal: seal,
    lo: lo, hi: hi, loss: loss,
    lossLo: Math.round(rev * lo / 100), lossHi: Math.round(rev * hi / 100),
    subLo: Math.round(loss * 0.40), subHi: Math.round(loss * 0.48),
    close: CLOSE_RANGE[level], recover: RECOVER_RANGE[level],
    perSqm: area > 0 ? Math.round(loss / area) : null,
    biz: s.biz, dist: Number(s.dist) || 0
  };
}

/* 测算页输入 → 回写当前用户档案，使首页/影响图/损失页/申请页同步 */
function syncUser(){
  if (!S.user || S.role !== 'merchant') return;
  var r = ringOf(calcState.dist);
  S.user.distance = Number(calcState.dist);
  S.user.ring = r.name;
  S.user.business = calcState.biz;
  S.user.area = Number(calcState.area);
  S.user.monthlyRevenue = Number(calcState.rev);
}
function moneyW(n){ var v = (n / 10000).toFixed(1); return (v.slice(-2) === '.0' ? v.slice(0, -2) : v) + '万' }

      '<div class="card" style="background:#EAF1FA;border:1px solid #C9D8EE"><div class="row" style="gap:8px"><span style="font-size:16px">💡</span><div><div style="font-size:13px;font-weight:600">沙盒建议</div><div class="hint" style="margin-top:3px">模拟结果推荐组合：定向回租比例提升 + 快速核赔承诺，可在成本增幅 3% 内进一步降低闭店率。</div></div></div></div>' +
      '<div class="between" style="gap:10px"><button class="btn ghost" style="flex:1;margin-top:0" data-act="resetSandbox">重置</button><button class="btn" style="flex:1;margin-top:0" data-act="toast" data-tip="演示：已生成政策建议报送稿">生成建议稿</button></div>' +
      '</div>';
  }
};

P.govWatch = {
  title: '舆情监测',
  tab: null,
  html: function () {
    var f = cur().wf || '分类';
    var chips = ['分类', '施工影响', '补偿/补贴', '政策咨询'].map(function (x) {
      return '<div class="chip' + (x === f ? ' on' : '') + '" data-act="filterWatch" data-v="' + x + '">' + x + '</div>';
    }).join('');
    var stats = D.watchStats.filter(function (w) { return f === '分类' || w.name.indexOf(f) >= 0 }).map(function (w) {
      return '<div class="item"><div class="i-no">' + w.n + '</div><div style="flex:1"><div class="i-name">' + w.name + '</div><div class="i-sub">' + w.s + '</div><div class="w-track"><div class="w-fill" style="width:' + w.tail + ';background:#1E5AA8"></div></div></div><div class="i-tail">' + w.tail + '</div></div>';
    }).join('');
    var rank = D.watchRank.map(function (r) {
      return '<div class="item"><div class="i-no">' + r.n + '</div><div style="flex:1"><div class="i-name">' + r.name + '</div><div class="i-sub">' + r.s + '</div></div>' + tagHtml(r.cls, r.tag) + '</div>';
    }).join('');
    return '<div class="chips">' + chips + '</div><div class="body-pad" style="padding-top:0">' +
      '<div class="card"><div class="card-title"><span>诉求分类</span><span class="more">7 日内 · 共 128 件</span></div>' + (stats || '<div class="hint">当前分类暂无数据</div>') + '</div>' +
      '<div class="card"><div class="card-title"><span>街镇协商率排行</span><span class="more">目标 ≥70%</span></div>' + rank + '</div>' +
      '<div class="card" style="background:#FFF7ED;border:1px solid #FED7AA"><div class="hint" style="color:#9A3412">📢 近 7 日「补偿/补贴」类诉求环比上升 6%，多为流程时长与标准透明度咨询，建议在商户端补充进度可视能力（已在产品路线图中）。</div></div>' +
      '</div>';
  }
};

/* ===== 公共模块 ===== */
P.news = {
  title: '消息通知',
  tab: null,
  html: function () {
    return '<div class="body-pad">' +
      '<div class="card"><div class="card-title"><span>全部消息</span><span class="more" style="cursor:pointer" data-act="readAll">全部已读</span></div>' +
      D.newsList.filter(function (n) { return !n.roles || n.roles.indexOf(S.role) >= 0 }).map(function (n) {
        return '<div class="item"><div style="flex:1"><div class="i-name" style="font-size:13px">' + n.t + '</div><div class="i-sub">' + n.s + '</div></div>' + tagHtml(n.cls, n.tag) + '</div>';
      }).join('') + '</div>' +
      '<div class="card"><div class="card-title"><span>订阅管理</span></div>' +
      D.subscriptions.map(function (sub) {
        return '<div class="svc" data-act="toast" data-tip="演示：订阅设置页未接入"><div class="sub-mark">' + sub.mark + '</div><div class="grow"><div class="svc-name">' + sub.name + '</div><div class="hint" style="margin-top:2px">' + sub.s + '</div></div>' + tagHtml(sub.cls, sub.tag) + '</div>';
      }).join('') + '</div>' +
      '<div class="card" style="background:#EAF1FA;border:1px solid #C9D8EE"><div class="hint">🔔 重要变更将通过服务通知触达；短信订阅请在「我的-设置」中管理。</div></div>' +
      '</div>';
  }
};

P.profile = {
  title: '我的',
  tab: 'profile',
  html: function () {
    var u = S.user;
    var isM = S.role === 'merchant';
    var roleName = u ? (isM ? u.name + ' · 商户' : u.name) : '游客（未登录）';
    var sub = !u ? '游客模式 · 仅可浏览公开信息'
      : isM ? u.district + ' · ' + ringOf(u.distance).name + ' · ' + u.business
      : u.scope;
    var avatar = { merchant: '店', investor: '投', gov: '政' }[S.role] || '游';
    var me = '<div class="card"><div class="me-card"><div class="me-avatar">' + avatar + '</div><div class="grow"><div class="me-name">' + roleName + '</div><div class="hint" style="margin-top:4px">' + sub + '</div></div></div></div>';
    var rows = '';
    if (isM) rows +=
      '<div class="svc" data-act="go" data-page="applyProgress"><div class="svc-ico">📄</div><div class="grow"><div class="svc-name">我的申请</div></div><span class="chev">›</span></div>' +
      '<div class="svc" data-act="go" data-page="consult"><div class="svc-ico">💬</div><div class="grow"><div class="svc-name">协商与申诉</div></div><span class="chev">›</span></div>' +
      '<div class="svc" data-act="go" data-page="news"><div class="svc-ico">🔔</div><div class="grow"><div class="svc-name">消息通知</div></div><span class="chev">›</span></div>';
    rows +=
      '<div class="svc" data-act="toast" data-tip="演示：查看隐私与授权说明"><div class="svc-ico">🔒</div><div class="grow"><div class="svc-name">隐私与授权</div></div><span class="chev">›</span></div>' +
      '<div class="svc" data-act="toast" data-tip="版本 v2.6.0（演示版）"><div class="svc-ico">ℹ</div><div class="grow"><div class="svc-name">关于我们</div></div><span class="chev">›</span></div>';
    var svc = '<div class="card">' + rows + '</div>';
    var legal = '<div class="card"><div class="card-title"><span>政策与依据</span></div><div class="hint">城市更新相关条例、征收补偿相关法规、《个人信息保护法》及配套办法。平台数据用于权益评估、补偿办理与监督公示。</div></div>';
    return '<div class="body-pad">' + me + svc + legal +
      '<button class="btn ghost" data-act="logout" style="color:#DC2626;border-color:#FECACA">' + (S.role === 'guest' ? '选择身份' : '切换身份') + '</button>' +
      '<div class="footnote">城市更新权益保障平台 · 演示版</div>' +
      '</div>';
  }
};

/* ========== 导航与渲染 ========== */
var TABS = {
  merchant: [
    { key: 'home', label: '首页', ico: '⌂', page: 'marketHome' },
    { key: 'construction', label: '施工', ico: '▣', page: 'construction' },
    { key: 'policy', label: '政策', ico: '▤', page: 'policyList' },
    { key: 'profile', label: '我的', ico: '◉', page: 'profile' }
  ],
  investor: [
    { key: 'home', label: '总览', ico: '⌂', page: 'invHome' },
    { key: 'map', label: '风险', ico: '◍', page: 'invMap' },
    { key: 'tools', label: '工具箱', ico: '⚒', page: 'invTools' },
    { key: 'profile', label: '我的', ico: '◉', page: 'profile' }
  ],
  gov: [
    { key: 'home', label: '总览', ico: '⌂', page: 'govHome' },
    { key: 'fund', label: '资金', ico: '¥', page: 'govFund' },
    { key: 'sandbox', label: '沙盒', ico: '◈', page: 'govSandbox' },
    { key: 'profile', label: '我的', ico: '◉', page: 'profile' }
  ],
  guest: [
    { key: 'construction', label: '施工公示', ico: '▣', page: 'construction' },
    { key: 'policy', label: '政策公示', ico: '▤', page: 'policyList' },
    { key: 'profile', label: '我的', ico: '◉', page: 'profile' }
  ]
};

var view = document.getElementById('view');
var tabbarEl = document.getElementById('tabbar');

function cur(){ return S.stack[S.stack.length - 1] }
function render(){
  var c = cur();
  var pg = P[c.page];
  /* 身份选择页自带大标题，隐藏顶栏避免重复；其余页面正常显示 */
  document.getElementById('hdr').style.display = (c.page === 'role') ? 'none' : '';
  document.getElementById('title').textContent = pg.title;
  document.getElementById('back').style.display = S.stack.length > 1 ? 'block' : 'none';
  view.innerHTML = pg.html(c);
  if (pg.after) pg.after(c);
  renderTab();
  view.scrollTop = 0;
}
function renderTab(){
  var c = cur();
  var pg = P[c.page];
  var tabs = TABS[S.role] || [];
  if (!pg.tab || !tabs.length) { tabbarEl.style.display = 'none'; tabbarEl.innerHTML = ''; return }
  tabbarEl.style.display = 'flex';
  tabbarEl.innerHTML = tabs.map(function (t) {
    return '<div class="tab' + (t.key === pg.tab ? ' on' : '') + '" data-act="tab" data-key="' + t.key + '"><span class="ico">' + t.ico + '</span><span>' + t.label + '</span></div>';
  }).join('');
}
/* 游客无身份，不能进入需要账号的功能页 */
var NEED_LOGIN = { calc: 1, loss: 1, apply: 1, applyProgress: 1, consult: 1, bind: 1 };
function go(page){
  if (S.role === 'guest' && NEED_LOGIN[page]) { toast('请先选择身份后再使用该功能'); return }
  S.stack.push({ page: page }); render()
}
function back(){ if (S.stack.length > 1) { S.stack.pop(); render() } }
function switchTab(page){ S.stack = [{ page: page }]; render() }
function replace(page){ S.stack[S.stack.length - 1] = { page: page }; render() }

var toastTimer = null;
function toast(text){
  var old = document.querySelector('.toast');
  if (old) old.remove();
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = text;
  document.getElementById('wrap').appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.remove() }, 1600);
}
function modal(title, content, onOk){
  var m = document.createElement('div');
  m.className = 'mask';
  m.innerHTML = '<div class="modal"><div class="md-title">' + title + '</div><div class="md-content">' + content + '</div><div class="md-btns"><button class="btn ghost" id="mdCancel">取消</button><button class="btn" id="mdOk">确定</button></div></div>';
  m.addEventListener('click', function (e) {
    if (e.target.id === 'mdCancel' || e.target === m) { m.remove(); return }
    if (e.target.id === 'mdOk') { m.remove(); onOk && onOk() }
  });
  document.getElementById('wrap').appendChild(m);
}

/* ========== 动作分发 ========== */
var ACTS = {
  back: function(){ back() },
  tab: function (t) {
    var tabs = TABS[S.role] || [];
    for (var i = 0; i < tabs.length; i++) if (tabs[i].key === t.getAttribute('data-key')) { switchTab(tabs[i].page); return }
  },
  choose: function (t) {
    var role = t.getAttribute('data-role');
    /* 同一身份已绑定：直接进入，不重复绑定 */
    if (S.user && S.role === role && role !== 'guest') {
      switchTab(role === 'merchant' ? 'marketHome' : role === 'investor' ? 'invHome' : 'govHome');
      return;
    }
    newSession(role);
    if (role === 'guest') { switchTab('construction'); toast('游客模式：仅可浏览公开信息'); return }
    if (role === 'merchant') { go('bind'); return }
    var acc = D.accounts[role];
    var extra = role === 'investor' ? '<br>绑定项目：' + D.project.name + '（' + D.project.code + '）' : '';
    modal('确认识别身份', '以「' + acc.name + '」身份进入？' + extra + '<br>本演示不接入真实账号体系。', function () {
      S.user = acc;
      switchTab(role === 'investor' ? 'invHome' : 'govHome');
      toast('已进入 ' + acc.name);
    });
  },
  go: function (t) { go(t.getAttribute('data-page')) },
  toast: function (t) { toast(t.getAttribute('data-tip')) },
  /* ---- 商户端 ---- */
  filterPolicy: function (t) { cur().filter = t.getAttribute('data-v'); render() },
  seg: function (t) { cur().seg = t.getAttribute('data-v'); render() },
  biz: function (t) { calcState.biz = t.getAttribute('data-v'); syncUser(); render() },
  pickDistrict: function (t) { bindDistrict = t.getAttribute('data-v'); render() },
  submitBind: function (t) {
    if (!bindName.trim()) { toast('请填写店铺名称'); return }
    S.user = makeMerchantUser();
    switchTab('marketHome');
    toast('绑定成功，欢迎使用');
  },
  submitCalc: function () { go('apply') },
  pickApply: function (t) { cur().policyIdx = Number(t.getAttribute('data-v')); render() },
  pickPeriod: function (t) { cur().periodIdx = Number(t.getAttribute('data-v')); render() },
  submitApply: function (t) {
    var idx = cur().policyIdx || 0;
    var name = APPLY_POLICIES[idx] || APPLY_POLICIES[0];
    modal('提交申请', '确认提交「' + name + '」申请？提交后 5 个工作日内反馈审批结果。', function () {
      S.apply = { policy: name, quote: assess() };
      replace('applyProgress');
      toast('申请已提交');
    });
  },
  /* ---- 投资方端 ---- */
  filterLedger: function (t) { cur().lf = t.getAttribute('data-v'); render() },
  /* ---- 政府端 / 公共 ---- */
  filterWatch: function (t) { cur().wf = t.getAttribute('data-v'); render() },
  sandboxPick: function (t) {
    if (!cur().mx) cur().mx = [0, 2];
    var mx = cur().mx;
    var v = Number(t.getAttribute('data-v'));
    var i = mx.indexOf(v);
    if (i >= 0) mx.splice(i, 1);
    else { if (mx.length >= 2) { toast('最多选择 2 项政策，请先取消一项'); return } mx.push(v); }
    cur().mx = mx;
    render();
  },
  resetSandbox: function () { cur().mx = [0, 2]; render(); toast('已重置为推荐组合') },
  readAll: function () {
    D.newsList.forEach(function (n) { n.tag = '已读'; n.cls = 'gray' });
    render();
    toast('已全部标记为已读');
  },
  logout: function (t) {
    modal('切换身份', '确定切换当前身份？可随时重新选择身份进入。', function () {
      switchTab('role');
      toast('已返回身份选择');
    });
  }
};

var wrapEl = document.getElementById('wrap');
wrapEl.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]');
  if (!t) return;
  var act = t.getAttribute('data-act');
  if (ACTS[act]) ACTS[act](t, e);
});

wrapEl.addEventListener('input', function (e) {
  var t = e.target;
  if (t.dataset.input === 'bindName') {
    bindName = t.value;
    var sb = document.getElementById('bindSubmit');
    if (sb) sb.disabled = !bindName.trim();
    return;
  }
  if (t.dataset.input === 'bindPhone') { bindPhone = t.value; return }
  if (t.dataset.input === 'calcArea') { calcState.area = t.value; syncUser(); refreshCalc(); return }
  if (t.dataset.input === 'calcRev') { calcState.rev = t.value; syncUser(); refreshCalc(); return }
  if (t.dataset.range === 'calcDist') {
    calcState.dist = Number(t.value);
    var dv = document.getElementById('calcDistVal');
    if (dv) dv.textContent = calcState.dist + 'm';
    syncUser();
    refreshCalc();
    return;
  }
});

/* ========== 启动 ========== */
S.stack = [{ page: 'role' }];
render();
</script>
</body>
</html>
